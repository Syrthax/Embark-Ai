<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Embark AI — A resilient autonomous AI agent for Minecraft</title>
<meta name="description" content="An open-source, self-hosted AI agent for Minecraft. Handles desync, lava, watchdogs and stale promises so embodied LLM agents can actually play — not just demo." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page-bg"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app-hero.jsx"></script>
<script type="text/babel" src="app-mid.jsx"></script>
<script type="text/babel" src="app-late.jsx"></script>
<script type="text/babel" src="app-tail.jsx"></script>

<script type="text/babel">
const App = () => {
  const { Nav, Hero, Features, Architecture, Telemetry, Showcase, WhyEmbark, Setup, OpenSource, Footer } = window;
  return (
    <React.Fragment>
      <Nav />
      <Hero />
      <Features />
      <Architecture />
      <Telemetry />
      <Showcase />
      <WhyEmbark />
      <Setup />
      <OpenSource />
      <Footer />
    </React.Fragment>
  );
};
const NEEDED = ['Nav','Hero','Features','Architecture','Telemetry','Showcase','WhyEmbark','Setup','OpenSource','Footer'];
const tryRender = (n = 0) => {
  const missing = NEEDED.filter(k => !window[k]);
  if (missing.length === 0) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else if (n < 200) {
    setTimeout(() => tryRender(n + 1), 30);
  } else {
    console.error('Embark: components never registered:', missing);
  }
};
tryRender();
</script>
</body>
</html>
